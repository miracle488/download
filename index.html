<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:sans-serif;padding:20px;text-align:center;max-width:500px;margin:auto}
  .card{border:1px solid #ddd;border-radius:12px;padding:20px;margin-top:40px}
  h2{font-size:18px;word-break:break-all}
  button{width:100%;padding:14px;margin-top:15px;background:#4285F4;color:white;border:none;border-radius:8px;font-size:16px}
  button:disabled{background:#ccc}
  #msg{color:#555;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <p>📄 Your file is ready</p>
  <h2 id="filename">Loading...</h2>
  <p id="msg">Fetching from Supabase...</p>
  <button id="dlBtn" onclick="download()" disabled>⬇ Download</button>
</div>

<script>
// PASTE YOUR DETAILS HERE
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Code lives ONLY in memory, never in localStorage, never shown
let pulledCode = null;
let pulledFilename = null;
let pulledId = null;

async function loadOnce(){
  pulledId = new URLSearchParams(window.location.search).get('id');
  if(!pulledId){
    document.getElementById('filename').innerText = "No file";
    document.getElementById('msg').innerText = "No ID in link";
    return;
  }

  // ONE-TIME query
  const { data, error } = await supabase.from('code_shares').select('*').eq('id', pulledId).single();

  if(error || !data){
    document.getElementById('filename').innerText = "Not found";
    document.getElementById('msg').innerText = "File not found or already downloaded";
    return;
  }

  pulledCode = data.code;
  pulledFilename = data.filename || "index.html";

  // Show ONLY title, not code
  document.getElementById('filename').innerText = pulledFilename;
  document.getElementById('msg').innerText = "Ready to download";
  document.getElementById('dlBtn').disabled = false;
}

async function download(){
  if(!pulledCode) return;

  // 1. Download in Chrome
  const blob = new Blob([pulledCode], {type: "text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = pulledFilename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);

  document.getElementById('msg').innerText = "Downloaded. Cleaning up...";
  document.getElementById('dlBtn').disabled = true;

  // 2. Delete from Supabase so it is not kept after download
  await supabase.from('code_shares').delete().eq('id', pulledId);

  // 3. Clear from memory
  pulledCode = null;
  pulledFilename = null;

  document.getElementById('msg').innerText = "Done. File deleted from server.";
  document.getElementById('filename').innerText = "Downloaded";
}

loadOnce();
</script>
